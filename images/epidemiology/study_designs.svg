<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Classification of epidemiological study designs</title>
  <desc id="desc">Observational studies are descriptive (case report, case series, cross-sectional, longitudinal) or analytical (ecological, cross-sectional, case-control, cohort). Experimental studies are RCTs, field trials, community trials and non-randomized trials.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <rect x="360" y="6" width="280" height="54" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="500.0" y="42.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Epidemiological studies</text>
  <rect x="130" y="100" width="300" height="54" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="280.0" y="136.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Observational</text>
  <rect x="680" y="100" width="300" height="54" rx="8" fill="#E8E4F3" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="830.0" y="136.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Experimental</text>
  <path d="M500,60 L500,80 L280,80 L280,98" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M500,60 L500,80 L830,80 L830,98" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="10" y="196" width="300" height="54" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="160.0" y="232.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Descriptive</text>
  <rect x="340" y="196" width="300" height="54" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="490.0" y="232.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Analytical</text>
  <path d="M280,154 L280,174 L160,174 L160,194" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M280,154 L280,174 L490,174 L490,194" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="10" y="270" width="300" height="190" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="160.0" y="331.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Case report</text>
  <text x="160.0" y="358.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Case series</text>
  <text x="160.0" y="386.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Cross-sectional</text>
  <text x="160.0" y="413.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Longitudinal</text>
  <rect x="340" y="270" width="300" height="190" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="490.0" y="331.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Ecological</text>
  <text x="490.0" y="358.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Cross-sectional</text>
  <text x="490.0" y="386.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Case-control</text>
  <text x="490.0" y="413.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Cohort</text>
  <rect x="680" y="196" width="300" height="264" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="830.0" y="266.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Randomized</text>
  <text x="830.0" y="294.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">controlled trial</text>
  <text x="830.0" y="321.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Field trial</text>
  <text x="830.0" y="349.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Community trial</text>
  <text x="830.0" y="376.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Non-randomized</text>
  <text x="830.0" y="404.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">(quasi-experimental)</text>
  <line x1="160" y1="250" x2="160" y2="268" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="250" x2="490" y2="268" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="830" y1="154" x2="830" y2="194" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <text x="160" y="488" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">generate hypotheses</text>
  <text x="490" y="488" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">test hypotheses</text>
  <text x="830" y="488" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">investigator assigns</text>
</svg>
