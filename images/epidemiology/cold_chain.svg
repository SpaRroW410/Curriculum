<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415" viewBox="0 0 1000 415" role="img" aria-labelledby="title desc">
  <title id="title">The vaccine cold chain in India</title>
  <desc id="desc">Vaccines move from the manufacturer to GMSD and state stores, regional stores, district stores, PHCs and CHCs with ice-lined refrigerators and deep freezers, and finally to session sites in vaccine carriers, kept at 2 to 8 degrees Celsius.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <rect x="10" y="20" width="300" height="140" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="160.0" y="97.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Manufacturer</text>
  <line x1="310" y1="90" x2="343" y2="90" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="345" y="20" width="300" height="140" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="495.0" y="70.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">GMSD / State</text>
  <text x="495.0" y="97.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">walk-in cooler,</text>
  <text x="495.0" y="125.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">freezer</text>
  <line x1="645" y1="90" x2="678" y2="90" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="680" y="20" width="300" height="140" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="830.0" y="70.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Regional /</text>
  <text x="830.0" y="97.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Divisional</text>
  <text x="830.0" y="125.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">walk-in cooler</text>
  <rect x="10" y="220" width="300" height="140" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="160.0" y="270.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">District</text>
  <text x="160.0" y="297.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">ILR, deep</text>
  <text x="160.0" y="325.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">freezer</text>
  <line x1="310" y1="290" x2="343" y2="290" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="345" y="220" width="300" height="140" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="495.0" y="270.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">PHC / CHC</text>
  <text x="495.0" y="297.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">ILR, deep</text>
  <text x="495.0" y="325.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">freezer</text>
  <line x1="645" y1="290" x2="678" y2="290" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="680" y="220" width="300" height="140" rx="8" fill="#FDE8E8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="830.0" y="270.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Session site</text>
  <text x="830.0" y="297.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">vaccine carrier</text>
  <text x="830.0" y="325.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">+ 4 ice packs</text>
  <path d="M830,160 L830,190 L160,190 L160,218" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="500" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">Vaccines kept at +2 °C to +8 °C from manufacturer to beneficiary</text>
</svg>
