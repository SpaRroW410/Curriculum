<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Relationship between incidence, prevalence and duration</title>
  <desc id="desc">A tank of prevalence filled by incidence at the top and drained by recovery and death, with migration in and out.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <path d="M220,120 L220,350 Q220,368 238,368 L562,368 Q580,368 580,350 L580,120" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <rect x="223" y="205" width="354" height="160" fill="#cfe3f3" stroke="none"/>
  <text x="400" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#2c3e50">PREVALENCE</text>
  <text x="400" y="314" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">existing cases</text>
  <line x1="400" y1="48" x2="400" y2="190" stroke="#2c3e50" stroke-width="4" marker-end="url(#arr)"/>
  <text x="400" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">INCIDENCE (new cases) flows in</text>
  <line x1="270" y1="368" x2="170" y2="420" stroke="#2c3e50" stroke-width="4" marker-end="url(#arr)"/>
  <text x="160" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Recovery</text>
  <line x1="530" y1="368" x2="630" y2="420" stroke="#2c3e50" stroke-width="4" marker-end="url(#arr)"/>
  <text x="640" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Death</text>
  <line x1="580" y1="250" x2="690" y2="250" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="8,5"/>
  <text x="700" y="258" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">Out-migration</text>
  <line x1="60" y1="160" x2="218" y2="160" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="8,5"/>
  <text x="60" y="145" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">In-migration</text>
</svg>
