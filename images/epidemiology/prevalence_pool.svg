<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Relationship between incidence, prevalence and duration</title>
  <desc id="desc">A tank representing prevalence. New cases (incidence) flow in at the top; cases leave through recovery and death at the bottom; migration adds or removes cases. Prevalence approximately equals incidence multiplied by mean duration.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <g transform="translate(70,0)">
  <path d="M150,110 L150,330 Q150,345 165,345 L435,345 Q450,345 450,330 L450,110" fill="none" stroke="#2c3e50" stroke-width="2.5"/>
  <rect x="152" y="190" width="296" height="153" fill="#cfe3f3" stroke="none"/>
  <text x="300" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">PREVALENCE</text>
  <text x="300" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">(pool of existing cases)</text>
  <line x1="300" y1="30" x2="300" y2="175" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>
  <text x="300" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">INCIDENCE — new cases flow in</text>
  <line x1="200" y1="345" x2="120" y2="400" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>
  <text x="110" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">Recovery / cure</text>
  <line x1="400" y1="345" x2="480" y2="400" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>
  <text x="490" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">Death</text>
  <line x1="450" y1="230" x2="540" y2="230" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="6,4"/>
  <text x="545" y="222" text-anchor="start" font-family="Georgia, serif" font-size="13" fill="#333">Out-migration</text>
  <line x1="60" y1="150" x2="148" y2="150" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="6,4"/>
  <text x="55" y="142" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#333">In-migration</text>
  <text x="300" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#2c3e50">P ≈ I × D   (steady state: inflow = outflow)</text>
  </g>
</svg>
