<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Design of a cohort study</title>
  <desc id="desc">A disease-free population is divided into exposed and unexposed cohorts which are followed forward in time; in each cohort some develop disease (cells a and c) and some do not (b and d). Incidence in exposed = a/(a+b), in unexposed = c/(c+d); RR is their ratio and AR their difference.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <rect x="20" y="130" width="200" height="80" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="120.0" y="165.9" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">Disease-free</text>
  <text x="120.0" y="184.6" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">population</text>
  <rect x="300" y="40" width="210" height="70" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="405.0" y="70.9" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">EXPOSED</text>
  <text x="405.0" y="89.6" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">cohort</text>
  <rect x="300" y="230" width="210" height="70" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="405.0" y="260.9" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">NOT EXPOSED</text>
  <text x="405.0" y="279.6" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">(comparison cohort)</text>
  <line x1="222" y1="160" x2="298" y2="80" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="222" y1="180" x2="298" y2="262" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="660" y="15" width="210" height="50" rx="8" fill="#FDE8E8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="765.0" y="44.9" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">Develop disease (a)</text>
  <rect x="660" y="85" width="210" height="50" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="765.0" y="114.9" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">No disease (b)</text>
  <line x1="512" y1="65" x2="658" y2="40" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="512" y1="85" x2="658" y2="110" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="660" y="205" width="210" height="50" rx="8" fill="#FDE8E8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="765.0" y="234.9" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">Develop disease (c)</text>
  <rect x="660" y="275" width="210" height="50" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="765.0" y="304.9" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">No disease (d)</text>
  <line x1="512" y1="255" x2="658" y2="230" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="512" y1="275" x2="658" y2="300" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <text x="585" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">follow up over time</text>
  <line x1="60" y1="345" x2="860" y2="345" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>
  <text x="460" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">Direction of enquiry: from cause (exposure) FORWARD to effect (disease)</text>
  <text x="460" y="396" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">Iₑ = a/(a+b) · I₀ = c/(c+d) · RR = Iₑ/I₀ · AR = Iₑ − I₀</text>
</svg>
