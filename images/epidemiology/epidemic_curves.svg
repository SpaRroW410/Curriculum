  <text x="160" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">Common source, single exposure</text>
  <text x="160" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">explosive rise, one peak, within one incubation period</text>
  <text x="160" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">Time (days) →</text>
