<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="title desc">
  <title id="title">Types of epidemic curves</title>
  <desc id="desc">Three epidemic curves. A single-exposure common-source epidemic rises explosively to one peak and falls within one incubation period. A continuous common-source epidemic forms a plateau and drops abruptly when the source is removed. A propagated epidemic shows successive, growing waves one incubation period apart.</desc>
