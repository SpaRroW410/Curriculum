  <text x="800" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">Propagated (person-to-person)</text>
  <text x="800" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">successive generations, one incubation period apart</text>
  <text x="800" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">Time (days) →</text>
  <text x="480" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">Cases ↑ · each bar = cases with onset on that day</text>
</svg>
