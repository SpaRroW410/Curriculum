  <rect x="181.0" y="216" width="18.0" height="14" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="201.0" y="230" width="18.0" height="0" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="221.0" y="230" width="18.0" height="0" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="241.0" y="230" width="18.0" height="0" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1"/>
