<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415" viewBox="0 0 1000 415" role="img" aria-labelledby="title desc">
  <title id="title">Framework for control of communicable diseases</title>
  <desc id="desc">Control the reservoir, interrupt transmission, protect the susceptible host, with the main measures listed under each.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <rect x="10" y="6" width="310" height="60" rx="8" fill="#FDE8E8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="165.0" y="45.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">1. Reservoir</text>
  <rect x="10" y="76" width="310" height="330" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="32" y="120" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Early diagnosis</text>
  <text x="32" y="172" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Notification</text>
  <text x="32" y="224" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Investigation</text>
  <text x="32" y="276" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Isolation</text>
  <text x="32" y="328" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Treatment</text>
  <text x="32" y="380" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Quarantine</text>
  <line x1="320" y1="36" x2="343" y2="36" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="345" y="6" width="310" height="60" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="500.0" y="45.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">2. Transmission</text>
  <rect x="345" y="76" width="310" height="330" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="367" y="120" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Water, sanitation</text>
  <text x="367" y="172" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Food hygiene</text>
  <text x="367" y="224" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Vector control</text>
  <text x="367" y="276" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Disinfection</text>
  <text x="367" y="328" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Hand hygiene</text>
  <text x="367" y="380" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Health education</text>
  <line x1="655" y1="36" x2="678" y2="36" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="680" y="6" width="310" height="60" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="835.0" y="45.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">3. Host</text>
  <rect x="680" y="76" width="310" height="330" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="702" y="120" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Active immunization</text>
  <text x="702" y="172" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Passive immunization</text>
  <text x="702" y="224" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Chemoprophylaxis</text>
  <text x="702" y="276" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Nutrition</text>
  <text x="702" y="328" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Personal hygiene</text>
  <text x="702" y="380" text-anchor="start" font-family="Georgia, serif" font-size="22" fill="#333">• Health education</text>
</svg>
