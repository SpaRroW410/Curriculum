<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="456" viewBox="0 0 1000 456" role="img" aria-labelledby="title desc">
  <title id="title">Uses of epidemiology</title>
  <desc id="desc">Four groups of uses. Healthcare management: community diagnosis, planning and evaluation of services, developing policies. Understanding the disease process: natural history, causes and risk factors, rise and fall of diseases, identification of syndromes. Public health practice: epidemic investigation, projections, surveillance, screening programmes, curriculum design. Clinical and preventive practice: effectiveness of preventive, treatment and diagnostic modalities, prognostic factors, clinical decision making, clinical research.</desc>
