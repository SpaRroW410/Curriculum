<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Steps of a randomized controlled trial</title>
  <desc id="desc">Protocol, reference population, study population with consent, randomization into study and control groups, blinded follow-up, outcome assessment, comparison.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <rect x="10" y="10" width="220" height="86" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="120.0" y="60.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Protocol</text>
  <line x1="230" y1="53" x2="258" y2="53" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="260" y="10" width="220" height="86" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="370.0" y="47.0" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Reference</text>
  <text x="370.0" y="74.5" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">population</text>
  <line x1="480" y1="53" x2="508" y2="53" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="510" y="10" width="220" height="86" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="620.0" y="47.0" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Study population</text>
  <text x="620.0" y="74.5" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">+ consent</text>
  <line x1="730" y1="53" x2="758" y2="53" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="760" y="10" width="220" height="86" rx="8" fill="#E8E4F3" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="870.0" y="60.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">RANDOMIZE</text>
  <path d="M870,96 L870,118 L30,118 L30,356" fill="none" stroke="#2c3e50" stroke-width="2.5"/>
  <line x1="30" y1="182" x2="48" y2="182" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="50" y="140" width="220" height="84" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="160.0" y="175.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">Study group</text>
  <text x="160.0" y="203.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">intervention</text>
  <line x1="270" y1="182" x2="298" y2="182" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="300" y="140" width="200" height="84" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="400.0" y="175.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Follow-up</text>
  <text x="400.0" y="203.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">(blinded)</text>
  <line x1="500" y1="182" x2="528" y2="182" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="530" y="140" width="200" height="84" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="630.0" y="175.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Assess</text>
  <text x="630.0" y="203.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">outcome</text>
  <line x1="30" y1="342" x2="48" y2="342" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="50" y="300" width="220" height="84" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="160.0" y="335.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">Control group</text>
  <text x="160.0" y="363.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">placebo/standard</text>
  <line x1="270" y1="342" x2="298" y2="342" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="300" y="300" width="200" height="84" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="400.0" y="335.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Follow-up</text>
  <text x="400.0" y="363.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">(blinded)</text>
  <line x1="500" y1="342" x2="528" y2="342" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="530" y="300" width="200" height="84" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="630.0" y="335.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Assess</text>
  <text x="630.0" y="363.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">outcome</text>
  <path d="M730,182 L755,182 L755,250 L773,250" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M730,342 L755,342 L755,274 L773,274" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="775" y="218" width="215" height="88" rx="8" fill="#FDE8E8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="882.5" y="254.8" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Compare</text>
  <text x="882.5" y="287.4" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">outcomes</text>
</svg>
