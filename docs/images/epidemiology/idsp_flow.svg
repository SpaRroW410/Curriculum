<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">IDSP reporting through IHIP</title>
  <desc id="desc">S forms from health workers, P forms from medical officers and L forms from laboratories feed the IHIP portal, which serves district, state and central surveillance units; the district Rapid Response Team investigates alerts.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <rect x="10" y="20" width="240" height="96" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="130.0" y="62.0" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">S form</text>
  <text x="130.0" y="89.5" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">health worker</text>
  <line x1="250" y1="68" x2="318" y2="188" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="10" y="140" width="240" height="96" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="130.0" y="181.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">P form</text>
  <text x="130.0" y="209.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">medical officer</text>
  <line x1="250" y1="188" x2="318" y2="188" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="10" y="260" width="240" height="96" rx="8" fill="#E8E4F3" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="130.0" y="301.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">L form</text>
  <text x="130.0" y="329.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">laboratory</text>
  <line x1="250" y1="308" x2="318" y2="188" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="320" y="140" width="180" height="96" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="410.0" y="180.8" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">IHIP</text>
  <text x="410.0" y="213.3" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">portal</text>
  <line x1="500" y1="188" x2="538" y2="188" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="540" y="20" width="220" height="96" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="650.0" y="62.0" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">District unit</text>
  <text x="650.0" y="89.5" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">(DSU)</text>
  <rect x="540" y="140" width="220" height="96" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="650.0" y="181.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">State unit</text>
  <text x="650.0" y="209.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">(SSU)</text>
  <rect x="540" y="260" width="220" height="96" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="650.0" y="301.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Central unit</text>
  <text x="650.0" y="329.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">(CSU, NCDC)</text>
  <path d="M520,188 L520,68 L538,68" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M520,188 L520,308 L538,308" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="800" y="20" width="190" height="96" rx="8" fill="#FDE8E8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="895.0" y="62.0" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">Rapid</text>
  <text x="895.0" y="89.5" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">Response Team</text>
  <line x1="760" y1="68" x2="798" y2="68" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="500" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">Weekly reporting + immediate alerts → investigation and response</text>
</svg>
