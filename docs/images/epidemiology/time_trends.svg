<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
  <title id="title">Long-term and periodic time trends</title>
  <desc id="desc">Three schematic panels: a secular trend rising over decades, seasonal peaks after the monsoon each year, and cyclic peaks every 2 to 3 years.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <line x1="20" y1="330" x2="320" y2="330" stroke="#2c3e50" stroke-width="2"/>
  <line x1="20" y1="330" x2="20" y2="70" stroke="#2c3e50" stroke-width="2"/>
  <text x="170" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Secular trend</text>
  <path d="M30.0,310.8 L48.7,308.4 L67.3,306.0 L86.0,301.2 L104.7,296.4 L123.3,289.2 L142.0,279.6 L160.7,267.6 L179.3,253.2 L198.0,236.4 L216.7,217.2 L235.3,195.6 L254.0,171.6 L272.7,142.8 L291.3,109.2 L310.0,90.0" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <text x="170" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#333">decades (e.g. IHD, diabetes)</text>
  <line x1="350" y1="330" x2="650" y2="330" stroke="#2c3e50" stroke-width="2"/>
  <line x1="350" y1="330" x2="350" y2="70" stroke="#2c3e50" stroke-width="2"/>
  <text x="500" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Seasonal</text>
  <path d="M360.0,306.0 L372.2,310.8 L384.3,310.8 L396.5,308.4 L408.7,301.2 L420.9,270.0 L433.0,186.0 L445.2,102.0 L457.4,138.0 L469.6,234.0 L481.7,294.0 L493.9,306.0 L506.1,308.4 L518.3,310.8 L530.4,308.4 L542.6,301.2 L554.8,267.6 L567.0,181.2 L579.1,94.8 L591.3,142.8 L603.5,238.8 L615.7,296.4 L627.8,306.0 L640.0,308.4" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <text x="500" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#333">months (e.g. malaria)</text>
  <line x1="680" y1="330" x2="980" y2="330" stroke="#2c3e50" stroke-width="2"/>
  <line x1="680" y1="330" x2="680" y2="70" stroke="#2c3e50" stroke-width="2"/>
  <text x="830" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Cyclic</text>
  <path d="M690.0,282.0 L715.5,126.0 L740.9,258.0 L766.4,294.0 L791.8,270.0 L817.3,114.0 L842.7,246.0 L868.2,286.8 L893.6,277.2 L919.1,118.8 L944.5,253.2 L970.0,291.6" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <text x="830" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#333">years (e.g. measles pre-vaccine)</text>
  <text x="500" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#333">Schematic shapes, not real data</text>
</svg>
