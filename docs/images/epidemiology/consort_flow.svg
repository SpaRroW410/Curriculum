<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
  <title id="title">CONSORT flow of participants in a randomized trial</title>
  <desc id="desc">Enrolment with exclusions, randomization into intervention and control arms, follow-up with losses recorded for each arm, and analysis of all participants as randomized (intention to treat).</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <rect x="10" y="10" width="190" height="70" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="105.0" y="52.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">Enrolment</text>
  <rect x="300" y="10" width="400" height="70" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="500.0" y="52.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Assessed for eligibility</text>
  <rect x="740" y="10" width="250" height="70" rx="8" fill="#f1f1f1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="865.0" y="39.5" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#333">Excluded</text>
  <text x="865.0" y="64.5" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#333">(not eligible, declined)</text>
  <line x1="700" y1="45" x2="738" y2="45" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="10" y="120" width="190" height="70" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="105.0" y="162.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">Allocation</text>
  <line x1="500" y1="80" x2="500" y2="118" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="380" y="120" width="240" height="70" rx="8" fill="#E8E4F3" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="500.0" y="164.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">RANDOMIZED</text>
  <path d="M500,190 L500,210 L330,210 L330,228" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M500,190 L500,210 L800,210 L800,228" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="10" y="230" width="190" height="70" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="105.0" y="272.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">Follow-up</text>
  <rect x="220" y="230" width="220" height="70" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="330.0" y="272.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">Intervention arm</text>
  <rect x="690" y="230" width="220" height="70" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="800.0" y="272.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">Control arm</text>
  <line x1="330" y1="300" x2="330" y2="328" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="190" y="330" width="280" height="70" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="330.0" y="359.5" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#333">Lost / discontinued</text>
  <text x="330.0" y="384.5" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#333">(count and reasons)</text>
  <line x1="330" y1="400" x2="330" y2="428" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="190" y="430" width="280" height="70" rx="8" fill="#FDE8E8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="330.0" y="458.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Analysed</text>
  <text x="330.0" y="486.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">(ITT: as randomized)</text>
  <line x1="800" y1="300" x2="800" y2="328" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="660" y="330" width="280" height="70" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="800.0" y="359.5" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#333">Lost / discontinued</text>
  <text x="800.0" y="384.5" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#333">(count and reasons)</text>
  <line x1="800" y1="400" x2="800" y2="428" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="660" y="430" width="280" height="70" rx="8" fill="#FDE8E8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="800.0" y="458.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Analysed</text>
  <text x="800.0" y="486.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">(ITT: as randomized)</text>
  <rect x="10" y="430" width="160" height="70" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="90.0" y="472.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">Analysis</text>
</svg>
