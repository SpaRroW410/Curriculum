<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img" aria-labelledby="title desc">
  <title id="title">Types of immunity</title>
  <desc id="desc">Immunity is innate or acquired; acquired is active (natural after infection, artificial after vaccination) or passive (natural from maternal antibody, artificial from immunoglobulins and antisera).</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <rect x="380" y="6" width="240" height="56" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="500.0" y="43.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">IMMUNITY</text>
  <rect x="40" y="100" width="300" height="56" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="190.0" y="137.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Innate</text>
  <rect x="600" y="100" width="300" height="56" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="750.0" y="137.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Acquired</text>
  <path d="M500,62 L500,82 L190,82 L190,98" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M500,62 L500,82 L750,82 L750,98" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="40" y="170" width="300" height="70" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="190.0" y="199.5" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#333">barriers, phagocytes,</text>
  <text x="190.0" y="224.5" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#333">complement</text>
  <rect x="460" y="200" width="240" height="60" rx="8" fill="#E8E4F3" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="580.0" y="239.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">ACTIVE</text>
  <rect x="740" y="200" width="240" height="60" rx="8" fill="#FDE8E8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="860.0" y="239.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">PASSIVE</text>
  <path d="M750,156 L750,178 L580,178 L580,198" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M750,156 L750,178 L860,178 L860,198" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="10" y="320" width="230" height="90" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="125.0" y="358.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Natural</text>
  <text x="125.0" y="386.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">infection</text>
  <rect x="258" y="320" width="230" height="90" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="373.0" y="358.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Artificial</text>
  <text x="373.0" y="386.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">vaccine</text>
  <rect x="506" y="320" width="230" height="90" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="621.0" y="358.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Natural</text>
  <text x="621.0" y="386.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">maternal Ab</text>
  <rect x="754" y="320" width="230" height="90" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="869.0" y="358.9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Artificial</text>
  <text x="869.0" y="386.4" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Ig, antisera</text>
  <path d="M580,260 L580,290 L125,290 L125,318" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M580,290 L373,290 L373,318" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M860,260 L860,290 L621,290 L621,318" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M860,290 L869,290 L869,318" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#333">Active: slow, lasting, memory · Passive: immediate, short-lived</text>
</svg>
