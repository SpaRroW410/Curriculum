<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
  <title id="title">Evaluating an association for causation</title>
  <desc id="desc">An observed association is checked for bias, chance and confounding in turn; if none explains it, causal criteria such as temporality are applied.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <rect x="10" y="20" width="980" height="60" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="500.0" y="59.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Observed association</text>
  <line x1="120" y1="80" x2="120" y2="118" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="10" y="120" width="220" height="96" rx="8" fill="#FDE8E8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="120.0" y="177.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Bias?</text>
  <line x1="230" y1="168" x2="258" y2="168" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="244" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">No</text>
  <line x1="120" y1="216" x2="120" y2="252" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="10" y="254" width="220" height="100" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="120.0" y="284.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Yes →</text>
  <text x="120.0" y="311.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">selection,</text>
  <text x="120.0" y="339.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">information</text>
  <line x1="370" y1="80" x2="370" y2="118" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="260" y="120" width="220" height="96" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="370.0" y="177.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Chance?</text>
  <line x1="480" y1="168" x2="508" y2="168" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="494" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">No</text>
  <line x1="370" y1="216" x2="370" y2="252" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="260" y="254" width="220" height="100" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="370.0" y="284.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Yes →</text>
  <text x="370.0" y="311.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">p-value,</text>
  <text x="370.0" y="339.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">95% CI</text>
  <line x1="620" y1="80" x2="620" y2="118" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="510" y="120" width="220" height="96" rx="8" fill="#E8E4F3" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="620.0" y="177.1" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Confounding?</text>
  <line x1="730" y1="168" x2="758" y2="168" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="744" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">No</text>
  <line x1="620" y1="216" x2="620" y2="252" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="510" y="254" width="220" height="100" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="620.0" y="284.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">Yes →</text>
  <text x="620.0" y="311.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">stratify,</text>
  <text x="620.0" y="339.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">adjust</text>
  <line x1="870" y1="80" x2="870" y2="118" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="760" y="120" width="220" height="96" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="870.0" y="160.8" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">Causal</text>
  <text x="870.0" y="193.3" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c3e50">criteria</text>
  <rect x="760" y="254" width="220" height="100" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="870.0" y="284.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">temporality</text>
  <text x="870.0" y="311.7" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">essential</text>
  <text x="870.0" y="339.2" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">(Bradford Hill)</text>
  <text x="500" y="392" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#333">Exclude bias, chance and confounding first; only then judge causation</text>
</svg>
