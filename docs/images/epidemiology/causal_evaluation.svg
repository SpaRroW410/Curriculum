<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Evaluating an association for causation</title>
  <desc id="desc">An observed association is checked in sequence for bias, chance and confounding; only if all are excluded is it a valid statistical association, to which causal criteria are applied: temporality, which is essential, then strength, consistency, specificity, dose-response, plausibility, coherence, experiment and analogy.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <rect x="250" y="10" width="340" height="50" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="420.0" y="40.2" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">Observed association</text>
  <line x1="420" y1="60" x2="420" y2="84" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="250" y="86" width="340" height="50" rx="8" fill="#FDE8E8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="420.0" y="116.2" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">1. Could it be due to BIAS?</text>
  <line x1="592" y1="111" x2="690" y2="111" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <text x="700" y="107" text-anchor="start" font-family="Georgia, serif" font-size="12" fill="#333">Yes → reject or correct</text>
  <text x="700" y="124" text-anchor="start" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">selection / information bias</text>
  <text x="432" y="153" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2c3e50">No</text>
  <line x1="420" y1="136" x2="420" y2="160" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="250" y="162" width="340" height="50" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="420.0" y="192.2" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">2. Could it be due to CHANCE?</text>
  <line x1="592" y1="187" x2="690" y2="187" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <text x="700" y="183" text-anchor="start" font-family="Georgia, serif" font-size="12" fill="#333">Yes → reject or correct</text>
  <text x="700" y="200" text-anchor="start" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">p-value, confidence interval</text>
  <text x="432" y="229" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2c3e50">No</text>
  <line x1="420" y1="212" x2="420" y2="236" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="250" y="238" width="340" height="50" rx="8" fill="#E8E4F3" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="420.0" y="268.2" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">3. Could it be due to CONFOUNDING?</text>
  <line x1="592" y1="263" x2="690" y2="263" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <text x="700" y="259" text-anchor="start" font-family="Georgia, serif" font-size="12" fill="#333">Yes → reject or correct</text>
  <text x="700" y="276" text-anchor="start" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">restriction, matching, stratification</text>
  <text x="432" y="305" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2c3e50">No</text>
  <line x1="420" y1="288" x2="420" y2="312" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="250" y="314" width="340" height="50" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="420.0" y="344.2" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">Valid statistical association</text>
  <line x1="420" y1="364" x2="420" y2="388" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="420" y1="364" x2="420" y2="388" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="250" y="390" width="340" height="50" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="420.0" y="420.2" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">4. Apply causal criteria</text>
  <text x="420" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">Temporality (essential) · strength · consistency · specificity · dose–response ·</text>
  <text x="420" y="488" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">biological plausibility · coherence · experimental evidence · analogy (Bradford Hill)</text>
</svg>
