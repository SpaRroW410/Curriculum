<svg xmlns="http://www.w3.org/2000/svg" width="950" height="300" viewBox="0 0 950 300" role="img" aria-labelledby="title desc">
  <title id="title">Steps of a randomized controlled trial</title>
  <desc id="desc">Protocol; reference population; experimental population with informed consent; randomization into study and control groups; follow-up with manipulation and blinding; assessment of outcome in each group; comparison of outcomes to give efficacy and NNT.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <rect x="10" y="10" width="210" height="60" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="115.0" y="35.9" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#333">Protocol</text>
  <text x="115.0" y="54.6" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#333">aims, design, ethics</text>
  <line x1="220" y1="40" x2="248" y2="40" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="250" y="10" width="210" height="60" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="355.0" y="35.9" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#333">Reference</text>
  <text x="355.0" y="54.6" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#333">population</text>
  <line x1="460" y1="40" x2="488" y2="40" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="490" y="10" width="210" height="60" rx="8" fill="#E6EEF5" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="595.0" y="35.9" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#333">Experimental</text>
  <text x="595.0" y="54.6" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#333">population + consent</text>
  <line x1="700" y1="40" x2="728" y2="40" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="730" y="10" width="210" height="60" rx="8" fill="#E8E4F3" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="835.0" y="35.9" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">RANDOMIZATION</text>
  <text x="835.0" y="54.6" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">random allocation</text>
  <path d="M835,70 L835,90 L28,90 L28,260" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <line x1="28" y1="140" x2="48" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="50" y="110" width="190" height="60" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="145.0" y="135.9" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">Study group</text>
  <text x="145.0" y="154.6" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">intervention</text>
  <line x1="240" y1="140" x2="278" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="280" y="110" width="200" height="60" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="380.0" y="136.2" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">Follow-up</text>
  <text x="380.0" y="153.7" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">(manipulation, blinding)</text>
  <line x1="480" y1="140" x2="518" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="520" y="110" width="170" height="60" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="605.0" y="136.2" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">Assessment</text>
  <text x="605.0" y="153.7" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">of outcome</text>
  <line x1="28" y1="260" x2="48" y2="260" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="50" y="230" width="190" height="60" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="145.0" y="255.9" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">Control group</text>
  <text x="145.0" y="274.6" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">placebo / standard</text>
  <line x1="240" y1="260" x2="278" y2="260" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="280" y="230" width="200" height="60" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="380.0" y="256.1" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">Follow-up</text>
  <text x="380.0" y="273.6" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">(manipulation, blinding)</text>
  <line x1="480" y1="260" x2="518" y2="260" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="520" y="230" width="170" height="60" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="605.0" y="256.1" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">Assessment</text>
  <text x="605.0" y="273.6" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">of outcome</text>
  <path d="M690,140 L710,140 L710,188 L728,188" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M690,260 L710,260 L710,212 L728,212" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="730" y="170" width="210" height="60" rx="8" fill="#FDE8E8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="835.0" y="195.9" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">Compare outcomes</text>
  <text x="835.0" y="214.6" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">efficacy, NNT</text>
</svg>
