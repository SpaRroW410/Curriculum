<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-labelledby="title desc">
  <title id="title">Framework for control of communicable diseases</title>
  <desc id="desc">Three groups of measures. Control the reservoir: early diagnosis, notification, investigation, isolation, treatment, quarantine, animal reservoir control. Interrupt transmission: water and sanitation, food hygiene, vector control, disinfection, hand hygiene, safe injections, health education. Protect the susceptible host: active, passive and combined immunization, chemoprophylaxis, and non-specific measures.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <rect x="10" y="10" width="290" height="50" rx="8" fill="#FDE8E8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="155.0" y="40.2" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">1. CONTROL THE RESERVOIR</text>
  <rect x="10" y="70" width="290" height="250" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="28" y="100" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Early diagnosis</text>
  <text x="28" y="132" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Notification</text>
  <text x="28" y="164" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Epidemiological investigation</text>
  <text x="28" y="196" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Isolation</text>
  <text x="28" y="228" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Treatment</text>
  <text x="28" y="260" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Quarantine</text>
  <text x="28" y="292" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Control of animal reservoir</text>
  <line x1="300" y1="35" x2="318" y2="35" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="320" y="10" width="290" height="50" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="465.0" y="40.2" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">2. INTERRUPT TRANSMISSION</text>
  <rect x="320" y="70" width="290" height="250" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="338" y="100" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Water purification, sanitation</text>
  <text x="338" y="132" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Food hygiene</text>
  <text x="338" y="164" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Vector control</text>
  <text x="338" y="196" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Disinfection</text>
  <text x="338" y="228" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Hand hygiene, masks</text>
  <text x="338" y="260" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Safe injections, blood safety</text>
  <text x="338" y="292" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Health education</text>
  <line x1="610" y1="35" x2="628" y2="35" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="630" y="10" width="290" height="50" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="775.0" y="40.2" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">3. PROTECT THE HOST</text>
  <rect x="630" y="70" width="290" height="250" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="648" y="100" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Active immunization</text>
  <text x="648" y="132" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Passive immunization</text>
  <text x="648" y="164" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Combined (e.g. rabies, tetanus)</text>
  <text x="648" y="196" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Chemoprophylaxis</text>
  <text x="648" y="228" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">• Non-specific: nutrition,</text>
  <text x="648" y="260" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">   personal hygiene, health education</text>
  <text x="470" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">Agent → reservoir → exit → transmission → entry → susceptible host: break any link and transmission stops</text>
</svg>
