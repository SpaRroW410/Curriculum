<svg xmlns="http://www.w3.org/2000/svg" width="950" height="300" viewBox="0 0 950 300" role="img" aria-labelledby="title desc">
  <title id="title">Crossover trial design</title>
  <desc id="desc">Subjects are randomized into two groups. Group 1 receives therapy A and group 2 therapy B in period 1; outcomes are measured; after a washout period with no treatment the groups cross over, group 1 receiving B and group 2 receiving A, and outcomes are measured again.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs>
  <rect x="10" y="70" width="120" height="160" rx="8" fill="#E8E4F3" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="70.0" y="155.2" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">RANDOMIZE</text>
  <line x1="130" y1="120" x2="168" y2="80" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="130" y1="180" x2="168" y2="220" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <text x="245.0" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">Period 1</text>
  <text x="415.0" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">Observe</text>
  <text x="555.0" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">Washout</text>
  <text x="715.0" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">Period 2</text>
  <text x="885.0" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">Observe</text>
  <rect x="170" y="55" width="150" height="50" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="245.0" y="76.4" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Group 1</text>
  <text x="245.0" y="92.7" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Therapy A</text>
  <line x1="320" y1="80" x2="358" y2="80" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="360" y="55" width="110" height="50" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="415.0" y="76.4" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Measure</text>
  <text x="415.0" y="92.7" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">outcome</text>
  <line x1="470" y1="80" x2="498" y2="80" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="500" y="55" width="110" height="50" rx="8" fill="#f3f3f3" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="555.0" y="76.4" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">no</text>
  <text x="555.0" y="92.7" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">treatment</text>
  <line x1="610" y1="80" x2="638" y2="80" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="640" y="55" width="150" height="50" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="715.0" y="76.4" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Group 1</text>
  <text x="715.0" y="92.7" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Therapy B</text>
  <line x1="790" y1="80" x2="828" y2="80" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="830" y="55" width="110" height="50" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="885.0" y="76.4" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Measure</text>
  <text x="885.0" y="92.7" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">outcome</text>
  <rect x="170" y="195" width="150" height="50" rx="8" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="245.0" y="216.4" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Group 2</text>
  <text x="245.0" y="232.7" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Therapy B</text>
  <line x1="320" y1="220" x2="358" y2="220" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="360" y="195" width="110" height="50" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="415.0" y="216.4" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Measure</text>
  <text x="415.0" y="232.7" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">outcome</text>
  <line x1="470" y1="220" x2="498" y2="220" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="500" y="195" width="110" height="50" rx="8" fill="#f3f3f3" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="555.0" y="216.4" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">no</text>
  <text x="555.0" y="232.7" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">treatment</text>
  <line x1="610" y1="220" x2="638" y2="220" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="640" y="195" width="150" height="50" rx="8" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="715.0" y="216.4" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Group 2</text>
  <text x="715.0" y="232.7" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Therapy A</text>
  <line x1="790" y1="220" x2="828" y2="220" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="830" y="195" width="110" height="50" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="885.0" y="216.4" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Measure</text>
  <text x="885.0" y="232.7" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">outcome</text>
  <text x="560" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">groups switch (cross over) after the washout</text>
  <text x="475" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">Each subject is his or her own control · fewer subjects needed · washout removes carry-over</text>
</svg>
