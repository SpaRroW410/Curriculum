<svg xmlns="http://www.w3.org/2000/svg" width="560" height="520" viewBox="0 0 560 520" role="img" aria-labelledby="title desc">
  <title id="title">The five systems under AYUSH</title>
  <desc id="desc">A hub-and-spoke diagram with AYUSH at the center, connected to five indigenous systems of medicine recognized in India: Ayurveda, Yoga and Naturopathy, Unani, Siddha, and Homeopathy.</desc>

  <line x1="280" y1="260" x2="280" y2="70" stroke="#999" stroke-width="2"/>
  <line x1="280" y1="260" x2="470" y2="180" stroke="#999" stroke-width="2"/>
  <line x1="280" y1="260" x2="430" y2="420" stroke="#999" stroke-width="2"/>
  <line x1="280" y1="260" x2="130" y2="420" stroke="#999" stroke-width="2"/>
  <line x1="280" y1="260" x2="90" y2="180" stroke="#999" stroke-width="2"/>

  <circle cx="280" cy="260" r="70" fill="#007ACC"/>
  <text x="280" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#fff">AYUSH</text>
  <text x="280" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#dbeeff">Ministry, est. 2014</text>

  <circle cx="280" cy="55" r="62" fill="#E3F2E1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="280" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">Ayurveda</text>
  <text x="280" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">Tridosha</text>

  <circle cx="495" cy="170" r="62" fill="#FFF6DA" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="495" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">Yoga &amp;</text>
  <text x="495" y="177" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">Naturopathy</text>

  <circle cx="450" cy="440" r="62" fill="#E8E4F3" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="450" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">Unani</text>
  <text x="450" y="453" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">Tibb system</text>

  <circle cx="110" cy="440" r="62" fill="#FDE8E8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="110" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">Siddha</text>
  <text x="110" y="453" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">Tamil tradition</text>

  <circle cx="65" cy="170" r="62" fill="#D6EAF8" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="65" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">Homeopathy</text>
  <text x="65" y="183" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">Hahnemann, 1796</text>
</svg>
